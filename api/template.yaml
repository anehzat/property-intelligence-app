AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: N3X7 Cotality API (Cognito + HTTP API + Lambda)

Parameters:
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: https://next.eronka.com,https://main.d2tgqj6ewcyky0.amplifyapp.com,http://localhost:3000
  SecretId:
    Type: String
    Default: n3x7/cotality

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: n3x7-staff
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      MfaConfiguration: OPTIONAL
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7

  WebClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: n3x7-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      IdTokenValidity: 1
      AccessTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        IdToken: hours
        AccessToken: hours
        RefreshToken: days

  SmokeClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: n3x7-smoke
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_ADMIN_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      IdTokenValidity: 1
      AccessTokenValidity: 1
      RefreshTokenValidity: 1
      TokenValidityUnits:
        IdToken: hours
        AccessToken: hours
        RefreshToken: days

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, DELETE, OPTIONS]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      Auth:
        DefaultAuthorizer: Cognito
        Authorizers:
          Cognito:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref WebClient
                - !Ref SmokeClient

  RpDataLinks:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: n3x7-rpdata-links
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  RpDataAccounts:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: n3x7-rpdata-accounts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: rpSub
          AttributeType: S
      KeySchema:
        - AttributeName: rpSub
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  RpDataKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Encrypts RP Data refresh tokens for N3X7
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountRootAdmin
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"

  RpDataKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/n3x7-rpdata
      TargetKeyId: !Ref RpDataKey

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/n3x7-api
      RetentionInDays: 30

  ApiFunction:
    Type: AWS::Serverless::Function
    DependsOn: ApiLogGroup
    Properties:
      FunctionName: n3x7-api
      CodeUri: dist/
      Handler: handler.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 15
      Environment:
        Variables:
          SECRET_ID: !Ref SecretId
          LINKS_TABLE: !Ref RpDataLinks
          ACCOUNTS_TABLE: !Ref RpDataAccounts
          KMS_KEY_ID: !GetAtt RpDataKey.Arn
          REDIRECT_ORIGINS: !Join [",", !Ref AllowedOrigins]
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretId}-*
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
              Resource:
                - !GetAtt RpDataLinks.Arn
                - !GetAtt RpDataAccounts.Arn
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
              Resource: !GetAtt RpDataKey.Arn
      Events:
        Listings:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /listings
            Method: GET
        Campaign:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /listings/{id}/campaign
            Method: GET
        RpDataStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /rpdata/status
            Method: GET
        RpDataConnect:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /rpdata/connect
            Method: POST
        RpDataDisconnect:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /rpdata/connection
            Method: DELETE

Outputs:
  ApiUrl:
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref WebClient
  SmokeClientId:
    Value: !Ref SmokeClient
